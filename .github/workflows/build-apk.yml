name: Build Seri Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'README.md'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --project-name seri --org com.seriassistant /tmp/seri_template
          cp -R /tmp/seri_template/android ./android
          mkdir -p android/app/src/main/kotlin/com/seriassistant/seri
          cp native/android/app/src/main/kotlin/com/seriassistant/seri/MainActivity.kt android/app/src/main/kotlin/com/seriassistant/seri/MainActivity.kt
          cp native/android/app/src/main/kotlin/com/seriassistant/seri/SeriWakeService.kt android/app/src/main/kotlin/com/seriassistant/seri/SeriWakeService.kt
          cp native/android/app/src/main/kotlin/com/seriassistant/seri/SeriVoiceInteractionService.kt android/app/src/main/kotlin/com/seriassistant/seri/SeriVoiceInteractionService.kt
          cp native/android/app/src/main/kotlin/com/seriassistant/seri/SeriVoiceInteractionSessionService.kt android/app/src/main/kotlin/com/seriassistant/seri/SeriVoiceInteractionSessionService.kt
          cp native/android/app/src/main/kotlin/com/seriassistant/seri/SeriVoiceInteractionSession.kt android/app/src/main/kotlin/com/seriassistant/seri/SeriVoiceInteractionSession.kt
          mkdir -p android/app/src/main/res/xml
          cp native/android/app/src/main/res/xml/seri_voice_interaction.xml android/app/src/main/res/xml/seri_voice_interaction.xml
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest'
          i = s.find('>', s.find(marker))
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>',
          ]
          for permission in permissions:
              name = permission.split('name="', 1)[1].split('"', 1)[0]
              if name not in s:
                  i = s.find('>', s.find('<manifest'))
                  s = s[:i+1] + '\n' + permission + s[i+1:]
          services = [
              '        <service android:name=".SeriWakeService" android:exported="false" android:foregroundServiceType="microphone" android:stopWithTask="false" />',
              '        <service android:name=".SeriVoiceInteractionService" android:label="Seri AI" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true"><intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter><meta-data android:name="android.voice_interaction" android:resource="@xml/seri_voice_interaction" /></service>',
              '        <service android:name=".SeriVoiceInteractionSessionService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true" />',
          ]
          for service in services:
              name = service.split('android:name="', 1)[1].split('"', 1)[0]
              if name not in s:
                  s = s.replace('</application>', service + '\\n    </application>')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seri-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
